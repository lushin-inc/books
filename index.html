<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Nation — Sales Gates</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --surface-hover: #F9FBFD;
    --border: #DDE3EC;
    --text: #1A2B4A;
    --text-muted: #647085;
    --hn-navy: #1E4E8C;
    --hn-red: #B71F2E;
    --accent-close: #2F8A4C;
    --stage-ds: #B71F2E;
    --stage-he: #C94A45;
    --stage-ap: #2B5EA7;
    --stage-dc: #3A5A8C;
    --stage-in: #B07E1E;
    --stage-sa: #2F8A4C;
    --stage-so: #1F6B3A;
    --card-radius: 14px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    padding: 40px 40px 0;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .header h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--hn-navy);
  }

  .header h1 span { color: var(--hn-red); }

  .header-rule {
    height: 4px;
    width: 64px;
    background: var(--hn-red);
    border-radius: 2px;
    margin: 14px 0 28px;
  }

  /* ── TIMELINE RAIL ── */
  .timeline-nav {
    padding: 10px 40px 0;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }

  .rail {
    display: flex;
    align-items: center;
    gap: 0;
    position: relative;
    padding: 0 10px;
  }

  .rail-line {
    position: absolute;
    top: 19px;
    left: 40px;
    right: 100px;
    height: 2px;
    background: var(--border);
    z-index: 0;
  }

  .rail-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    z-index: 1;
    flex: 1;
    transition: var(--transition);
  }

  .rail-node:last-child { flex: 0; min-width: 70px; }

  .node-dot {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.3px;
    transition: var(--transition);
    border: 2px solid transparent;
    position: relative;
  }

  .rail-node:hover .node-dot { transform: scale(1.15); }
  .rail-node.active .node-dot {
    transform: scale(1.2);
    box-shadow: 0 4px 14px rgba(26,43,74,0.25);
  }

  .node-label {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    transition: var(--transition);
    white-space: nowrap;
  }

  .rail-node.active .node-label { color: var(--text); }

  /* ── STAGE DETAIL PANEL ── */
  .stage-panel {
    max-width: 1400px;
    margin: 28px auto 0;
    padding: 0 40px 50px;
    animation: panelIn 0.3s ease;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .panel-badge {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 8px;
    text-transform: uppercase;
  }

  .panel-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--hn-navy);
  }

  .panel-note {
    font-size: 12px;
    color: var(--text-muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    background: var(--surface);
  }

  .panel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 800px) {
    .panel-grid { grid-template-columns: 1fr; }
    .header, .timeline-nav, .stage-panel { padding-left: 20px; padding-right: 20px; }
    .header h1 { font-size: 26px; }
    .rail-line { left: 20px; right: 50px; }
    .node-label { white-space: normal; font-size: 9px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px;
    transition: var(--transition);
    box-shadow: 0 1px 3px rgba(26,43,74,0.06);
  }

  .card:hover { border-color: #C6CFDD; background: var(--surface-hover); }

  .card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .card ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card li {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    padding-left: 20px;
    position: relative;
  }

  .card li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 7px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hn-navy);
    opacity: 0.4;
  }

  .card li em {
    font-style: normal;
    color: var(--hn-red);
    font-weight: 600;
  }

  /* ── EXIT CRITERIA CARD ── */
  .exit-card {
    border-left: 3px solid;
  }

  .exit-card .card-label { display: flex; align-items: center; gap: 8px; }
  .exit-card .card-label::before {
    content: '✓';
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
  }

  .exit-card li {
    cursor: pointer;
    user-select: none;
    transition: var(--transition);
    padding-left: 28px;
  }

  .exit-card li::before {
    content: '';
    width: 16px;
    height: 16px;
    border-radius: 5px;
    border: 1.5px solid var(--text-muted);
    background: transparent;
    top: 3px;
    left: 0;
    opacity: 1;
    transition: var(--transition);
  }

  .exit-card li.checked {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: rgba(100,112,133,0.45);
  }

  .exit-card li.checked::before {
    border-color: var(--accent-close);
    background: var(--accent-close);
  }

  .exit-card li.checked::after {
    content: '✓';
    position: absolute;
    left: 3px;
    top: 4px;
    font-size: 10px;
    color: white;
    font-weight: 700;
  }

  /* ── FIELD NOTE ── */
  .coaching-tip {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(30,78,140,0.05) 0%, rgba(30,78,140,0.02) 100%);
    border: 1px solid rgba(30,78,140,0.18);
    border-radius: var(--card-radius);
    padding: 18px 24px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .tip-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .tip-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
  }

  .tip-text strong { color: var(--hn-red); font-weight: 700; }

  /* ── RESET BUTTON ── */
  .reset-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: var(--transition);
    z-index: 100;
    display: none;
    box-shadow: 0 2px 8px rgba(26,43,74,0.1);
  }

  .reset-btn:hover { background: var(--surface-hover); color: var(--text); }
  .reset-btn.visible { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Home Nation <span>Sales Gates</span></h1>
  </div>
  <div class="header-rule"></div>
</div>

<div class="timeline-nav">
  <div class="rail">
    <div class="rail-line"></div>
    <div class="rail-node active" data-stage="ds" onclick="showStage('ds')">
      <div class="node-dot" style="background:var(--stage-ds); color:#fff;">DS</div>
      <div class="node-label">Discovery</div>
    </div>
    <div class="rail-node" data-stage="he" onclick="showStage('he')">
      <div class="node-dot" style="background:var(--stage-he); color:#fff;">HE</div>
      <div class="node-label">Home Estimate</div>
    </div>
    <div class="rail-node" data-stage="ap" onclick="showStage('ap')">
      <div class="node-dot" style="background:var(--stage-ap); color:#fff;">AP</div>
      <div class="node-label">Application</div>
    </div>
    <div class="rail-node" data-stage="dc" onclick="showStage('dc')">
      <div class="node-dot" style="background:var(--stage-dc); color:#fff;">DC</div>
      <div class="node-label">Docs</div>
    </div>
    <div class="rail-node" data-stage="in" onclick="showStage('in')">
      <div class="node-dot" style="background:var(--stage-in); color:#fff;">IN</div>
      <div class="node-label">Installer</div>
    </div>
    <div class="rail-node" data-stage="sa" onclick="showStage('sa')">
      <div class="node-dot" style="background:var(--stage-sa); color:#fff;">SA</div>
      <div class="node-label">Sales Agreement</div>
    </div>
    <div class="rail-node" data-stage="so" onclick="showStage('so')">
      <div class="node-dot" style="background:var(--stage-so); color:#fff;">SO</div>
      <div class="node-label">Sold</div>
    </div>
  </div>
</div>

<div id="stage-panel" class="stage-panel"></div>

<button class="reset-btn" id="resetBtn" onclick="resetChecks()">↻ Reset Checklist</button>

<script>
const stages = {
  ds: {
    badge: 'DS',
    title: 'Discovery',
    color: 'var(--stage-ds)',
    note: 'Qualification lives here — a matching game, not a judgment call',
    activities: [
      'They own land — or are replacing a home on their lot — <em>cleared, with utilities</em> in place or realistically planned',
      'The lot is <em>buildable</em> — zoned for a manufactured home and not in a flood zone. <em>Check it here, not at the sales agreement</em>',
      'Cash confirmed, or a financing path identified — <em>income and debts on the table before any application or hard pull</em>',
      'Budget covers home <em>plus site work</em> — their numbers, not averages',
      '<em>IN, MI, OH, WI, TN, FL — we run the whole job.</em> There is nothing for them to manage, so don\'t sell it as their problem',
      '<em>Any other state — we deliver the home and they run the job.</em> That one is a real qualifier: break it into pieces, don\'t dump every detail',
      '"Needs to see homes in person" is a <em>disqualifier, not an objection to overcome</em>',
      'Turnkey shopper? Refer them out and move on'
    ],
    exits: [
      'Land: owned, cleared, utilities confirmed',
      'Lot is buildable — zoning and flood zone checked',
      'Cash or financing path confirmed',
      'Budget covers home + site work — their numbers',
      'Which model applies — we run the job, or they do',
      'Not a fit → referred out, or dated follow-up with a named trigger'
    ],
    tip: 'Your job isn\'t to close everyone — <strong>win fast, lose faster.</strong> An objection you "overcame" at Discovery doesn\'t die; it\'s waiting for you at Application. Yes is an answer, no is an answer — a deal lingering unqualified isn\'t.'
  },
  he: {
    badge: 'HE',
    title: 'Home Estimate',
    color: 'var(--stage-he)',
    note: null,
    activities: [
      '<em>Nothing gets an estimate until Discovery is closed.</em> Give a price on the phone all day — but an estimate is a document, and a document makes people feel finished',
      'We close <em>12-15%</em> of the estimates we send. Aim for <em>20%</em> by sending fewer, not by following up harder',
      'The estimate review is a <em>scheduled call you walk together</em> — never "I\'ll send you stuff"',
      'Customer homework (building department, township approvals) <em>cleared before the review</em> — estimate after blockers, not before',
      'Full cost on the table: setup, utilities, site work — cheapest ≠ best value',
      'Cash: <em>collect the deposit</em> at the estimate review',
      'They have an action item? Book the placeholder: <em>"I don\'t want to interrupt your day — mind if we set a 5-minute touch base for Tuesday at 2?"</em>'
    ],
    exits: [
      'Discovery closed before this estimate existed',
      'Estimate reviewed live with the customer',
      'Full cost covered — no site-work surprises later',
      'Customer blockers cleared or dated',
      'Cash: deposit in',
      'Next step has a date and time'
    ],
    tip: 'If they\'ve got homework between now and next time, <strong>book the placeholder before you hang up.</strong> Five minutes on the calendar beats an email with "follow up" in the subject line.'
  },
  ap: {
    badge: 'AP',
    title: 'Application',
    color: 'var(--stage-ap)',
    note: 'Finance deals — cash moves ahead',
    activities: [
      'Application submitted <em>complete and transparent</em> — nothing for the lender to discover',
      'Payment-comfort conversation happens <em>before</em> approval: monthly amount, 25 years, what\'s left in reserve — <em>"How do you feel about that payment for the next 25 years?"</em>',
      'Anything that was a problem at Discovery <em>resurfaces here</em> — requalify before you submit',
      'Keep the next step dated — an application sitting quiet is an open door for competitors'
    ],
    exits: [
      'Application submitted, complete',
      'Payment comfort confirmed — in their words',
      'Old objections re-checked, not assumed gone',
      'Next step dated'
    ],
    tip: 'The application wait is when competitors strike — that\'s where the Habeck deal went. <strong>A dated next step keeps you in the deal;</strong> silence hands it to whoever calls them next.'
  },
  dc: {
    badge: 'DC',
    title: 'Docs',
    color: 'var(--stage-dc)',
    note: null,
    activities: [
      'Lender reviews <em>full documents before approving</em> — days, not hours. Set that expectation up front.',
      'Proactive status updates while they wait — <em>a quiet file feels like a stalled deal</em> to the customer',
      'Watch loan expiration dates — a stale approval is a dead deal',
      'Denied → <em>note why</em>, so the next application doesn\'t repeat it'
    ],
    exits: [
      'Docs in, complete — nothing outstanding',
      'Customer knows the timeline and expects the wait',
      'Approved → next step on the calendar'
    ],
    tip: 'Cold feet at Docs means the payment conversation didn\'t happen at Application. <strong>If you\'re hearing fear here, stop and have it now</strong> — before the approval, not after.'
  },
  in: {
    badge: 'IN',
    title: 'Installer',
    color: 'var(--stage-in)',
    note: null,
    activities: [
      'Site work scoped and installer lined up — <em>these numbers feed the sales agreement</em>',
      'You\'re the project manager: <em>permits, soil tests, zoning</em> — ask <em>"When will you have that done?"</em> and write it down',
      'Construction consultant introduced and looped in',
      'Two weeks of silence → <em>pick up the phone</em>'
    ],
    exits: [
      'Installer confirmed, site work quoted',
      'Customer task list dated',
      'Consultant introduced'
    ],
    tip: 'Customers hit dates they set <strong>with you, on a calendar.</strong> Ask when, write it down, follow up that day.'
  },
  sa: {
    badge: 'SA',
    title: 'Sales Agreement',
    color: 'var(--stage-sa)',
    note: null,
    activities: [
      'The agreement is a <em>recap, not a reveal</em> — every number matches the estimate and installer quote they\'ve already seen',
      'Signed + <em>down payment collected</em>',
      'Walk the road to Sold so they know exactly what happens next — and when'
    ],
    exits: [
      'Agreement signed',
      'Down payment in the system',
      'Next check-in dated'
    ],
    tip: 'No surprises at signing. <strong>If a number shows up here they haven\'t seen before, the deal wobbles</strong> — surface every cost back at Home Estimate and Installer.'
  },
  so: {
    badge: 'SO',
    title: 'Sold',
    color: 'var(--stage-so)',
    note: null,
    activities: [
      'Handoff is clean: consultant, install dates, and <em>who they call</em> with questions',
      'Log the win — <em>what made them a good fit</em> sharpens the Discovery checklist',
      'Lost one along the way? Log <em>deal name, what happened at the end, and the stage</em> — same document, same reason'
    ],
    exits: [
      'Handoff complete — customer knows what\'s next',
      'Win or loss logged with its stage'
    ],
    tip: 'Every finished deal — won or lost — teaches the Discovery checklist something. <strong>Log it while it\'s fresh.</strong>'
  }
};

let checkedItems = JSON.parse(localStorage.getItem('hn_gates_v3') || '{}');
let currentStage = 'ds';

function showStage(id) {
  currentStage = id;
  const s = stages[id];

  document.querySelectorAll('.rail-node').forEach(n => {
    n.classList.toggle('active', n.dataset.stage === id);
  });

  const panel = document.getElementById('stage-panel');
  const stageChecks = checkedItems[id] || [];

  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-badge" style="background:${s.color}; color:#fff;">${s.badge}</div>
      <div class="panel-title">${s.title}</div>
      ${s.note ? `<div class="panel-note">${s.note}</div>` : ''}
    </div>
    <div class="panel-grid">
      <div class="card">
        <div class="card-label">What Happens Here</div>
        <ul>${s.activities.map(a => `<li>${a}</li>`).join('')}</ul>
      </div>
      <div class="card exit-card" style="border-left-color:${s.color}">
        <div class="card-label" style="color:${s.color}">
          <span>Before You Move On</span>
          <span style="margin-left:auto;font-size:10px;opacity:0.6;font-weight:400;letter-spacing:0">${stageChecks.length}/${s.exits.length}</span>
        </div>
        <ul>${s.exits.map((e, i) =>
          `<li class="${stageChecks.includes(i) ? 'checked' : ''}" onclick="toggleCheck('${id}', ${i})">${e}</li>`
        ).join('')}</ul>
      </div>
      <div class="coaching-tip">
        <div class="tip-icon">📌</div>
        <div class="tip-text">${s.tip}</div>
      </div>
    </div>
  `;

  panel.style.animation = 'none';
  panel.offsetHeight;
  panel.style.animation = 'panelIn 0.3s ease';

  updateResetBtn();
}

function toggleCheck(stageId, idx) {
  if (!checkedItems[stageId]) checkedItems[stageId] = [];
  const arr = checkedItems[stageId];
  const pos = arr.indexOf(idx);
  if (pos > -1) arr.splice(pos, 1);
  else arr.push(idx);
  localStorage.setItem('hn_gates_v3', JSON.stringify(checkedItems));
  showStage(currentStage);
}

function resetChecks() {
  checkedItems = {};
  localStorage.setItem('hn_gates_v3', JSON.stringify(checkedItems));
  showStage(currentStage);
}

function updateResetBtn() {
  const btn = document.getElementById('resetBtn');
  const hasChecks = Object.values(checkedItems).some(a => a.length > 0);
  btn.classList.toggle('visible', hasChecks);
}

// Keyboard nav
document.addEventListener('keydown', e => {
  const keys = Object.keys(stages);
  const idx = keys.indexOf(currentStage);
  if (e.key === 'ArrowRight' && idx < keys.length - 1) showStage(keys[idx + 1]);
  if (e.key === 'ArrowLeft' && idx > 0) showStage(keys[idx - 1]);
});

showStage('ds');
</script>
</body>
</html>
